<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengulang Teks</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #cce6ff 0%, #e6f2ff 100%);
            min-height: 100vh;
            padding: 15px;
            transition: background 0.3s ease;
        }
        .wadah {
            max-width: 560px;
            margin: 0 auto;
        }

        .layar-pilih {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(200,230,255,0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .kotak-pilih {
            background: #ffffff;
            padding: 25px;
            border-radius: 18px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 2px solid #0066cc;
            box-shadow: 0 0 30px rgba(0,100,200,0.25);
        }
        .kotak-pilih h3 {
            color: #0066cc;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
        }
        .pilihan-warna {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .warna {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .warna.aktif {
            border-color: #000;
            transform: scale(1.15);
        }
        .biru { background: linear-gradient(180deg, #54b0ff 0%, #007bff 50%, #006ee6 100%); }
        .hijau { background: linear-gradient(180deg, #54ff9f 0%, #00cc66 50%, #00aa55 100%); }
        .merah { background: linear-gradient(180deg, #ff6666 0%, #ff0000 50%, #cc0000 100%); }
        .ungu { background: linear-gradient(180deg, #cc99ff 0%, #9933ff 50%, #7700dd 100%); }
        .kuning { background: linear-gradient(180deg, #ffff66 0%, #ffcc00 50%, #ff9900 100%); }
        .oren { background: linear-gradient(180deg, #ffcc88 0%, #ff8800 50%, #ff6600 100%); }
        .putih { background: linear-gradient(180deg, #f0f0f0 0%, #e0e0e0 50%, #d0d0d0 100%); border: 2px solid #bbb; }
        .hitam { background: linear-gradient(180deg, #444444 0%, #222222 50%, #000000 100%); }
        .pink { background: linear-gradient(180deg, #ffb3d9 0%, #ff66b3 50%, #ff3399 100%); }
        .coklat { background: linear-gradient(180deg, #d9b38c 0%, #b36b39 50%, #804000 100%); }

        .tombol-lanjut {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: #cccccc;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }
        .tombol-lanjut.bisa {
            background: linear-gradient(180deg, #54b0ff 0%, #007bff 50%, #006ee6 100%);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(100,180,255,0.4);
        }

        .isi-utama { display: none; }

        h2 {
            text-align: center;
            color: #0066cc;
            margin-bottom: 24px;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: color 0.3s ease;
        }
        .ikon-pengulang {
            font-size: 30px;
            color: #ff9900;
            transition: color 0.3s ease;
        }
        input, textarea {
            width: 100%;
            padding: 14px 18px;
            font-size: 18px;
            border: 1px solid #99ccff;
            border-radius: 16px;
            outline: none;
            margin-bottom: 16px;
            background: #ffffff;
            transition: border-color 0.3s ease;
        }
        input::placeholder, textarea::placeholder { color: #999999; }
        .pilihan-mode {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .pilihan-mode label {
            flex: 1;
            padding: 12px 10px;
            border: 1px solid #99ccff;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #0066cc;
            background: #ffffff;
            transition: all 0.3s ease;
        }
        .pilihan-mode input { display: none; }
        .pilihan-mode input:checked + span { color: #fff; font-weight: bold; }
        .pilihan-mode label:has(input:checked) {
            background: linear-gradient(180deg, #4da6ff 0%, #0080ff 100%);
            border-color: #0080ff;
        }

        .tombol-buat, .tombol-salin, .tombol-donasi {
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .tombol-buat::before, .tombol-salin::before, .tombol-donasi::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: cahaya 2.5s infinite linear;
        }
        @keyframes cahaya {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .tombol-buat:active, .tombol-salin:active, .tombol-donasi:active { transform: scale(0.98); }
        .tombol-buat {
            width: 100%;
            padding: 8px 12px;
            font-size: 18px;
            margin-bottom: 18px;
            background: linear-gradient(180deg, #54b0ff 0%, #007bff 50%, #006ee6 100%);
            box-shadow: 0 0 20px rgba(100,180,255,0.5), 0 0 30px rgba(100,180,255,0.3);
        }
        .tombol-salin {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 19px;
            margin-bottom: 15px;
            background: linear-gradient(180deg, #54b0ff 0%, #007bff 50%, #006ee6 100%);
            box-shadow: 0 0 20px rgba(100,180,255,0.5), 0 0 30px rgba(100,180,255,0.3);
        }
        .tombol-donasi {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 18px;
            background: linear-gradient(180deg, #ffdd55 0%, #ffaa00 50%, #ff8800 100%);
            box-shadow: 0 0 20px rgba(255,170,0,0.5), 0 0 30px rgba(255,170,0,0.3);
        }

        #hasil {
            height: 320px;
            resize: none;
            white-space: pre-wrap;
            font-size: 18px;
            line-height: 1.6;
            background: #ffffff;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid #99ccff;
            transition: border-color 0.3s ease;
        }
        .info {
            font-size: 17px;
            color: #0066cc;
            margin-bottom: 18px;
            padding-left: 4px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
                .popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: flex; align-items: center;
            justify-content: center; z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .popup-overlay.tampil { opacity: 1; pointer-events: auto; }
        .popup-kotak {
            background: #2ecc71; color: #fff; padding: 20px 40px; border-radius: 16px;
            font-size: 20px; font-weight: bold; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); transform: scale(0.8);
            transition: transform 0.3s ease;
        }
        .popup-overlay.tampil .popup-kotak { transform: scale(1); }

    </style>
</head>
<body>

<div class="wadah">
    <div class="layar-pilih" id="layarPilih">
        <div class="kotak-pilih">
            <h3>Pilih Dulu Warna Kesukaan Kamu 👇</h3>
            <div class="pilihan-warna">
                <div class="warna biru" data-gradien="linear-gradient(180deg, #54b0ff 0%, #007bff 50%, #006ee6 100%)" data-cahaya="rgba(100,180,255,0.5)" data-warna-teks="#0066cc" data-gradien-mode="linear-gradient(180deg, #4da6ff 0%, #0080ff 100%)"></div>
                <div class="warna hijau" data-gradien="linear-gradient(180deg, #54ff9f 0%, #00cc66 50%, #00aa55 100%)" data-cahaya="rgba(80,255,150,0.5)" data-warna-teks="#007733" data-gradien-mode="linear-gradient(180deg, #4dff99 0%, #00bb55 100%)"></div>
                <div class="warna merah" data-gradien="linear-gradient(180deg, #ff6666 0%, #ff0000 50%, #cc0000 100%)" data-cahaya="rgba(255,100,100,0.5)" data-warna-teks="#bb0000" data-gradien-mode="linear-gradient(180deg, #ff5555 0%, #dd0000 100%)"></div>
                <div class="warna ungu" data-gradien="linear-gradient(180deg, #cc99ff 0%, #9933ff 50%, #7700dd 100%)" data-cahaya="rgba(180,120,255,0.5)" data-warna-teks="#6600bb" data-gradien-mode="linear-gradient(180deg, #bb88ff 0%, #8822ee 100%)"></div>
                <div class="warna kuning" data-gradien="linear-gradient(180deg, #ffff66 0%, #ffcc00 50%, #ff9900 100%)" data-cahaya="rgba(255,220,100,0.5)" data-warna-teks="#997700" data-gradien-mode="linear-gradient(180deg, #ffff55 0%, #ffbb00 100%)"></div>
                <div class="warna oren" data-gradien="linear-gradient(180deg, #ffcc88 0%, #ff8800 50%, #ff6600 100%)" data-cahaya="rgba(255,150,80,0.5)" data-warna-teks="#bb5500" data-gradien-mode="linear-gradient(180deg, #ffbb77 0%, #ff7700 100%)"></div>
                <div class="warna putih" data-gradien="linear-gradient(180deg, #f0f0f0 0%, #e0e0e0 50%, #d0d0d0 100%)" data-cahaya="rgba(180,180,180,0.6)" data-warna-teks="#222222" data-gradien-mode="linear-gradient(180deg, #e8e8e8 0%, #d0d0d0 100%)"></div>
                <div class="warna hitam" data-gradien="linear-gradient(180deg, #444444 0%, #222222 50%, #000000 100%)" data-cahaya="rgba(80,80,80,0.5)" data-warna-teks="#000000" data-gradien-mode="linear-gradient(180deg, #333333 0%, #111111 100%)"></div>
                <div class="warna pink" data-gradien="linear-gradient(180deg, #ffb3d9 0%, #ff66b3 50%, #ff3399 100%)" data-cahaya="rgba(255,120,180,0.5)" data-warna-teks="#cc0066" data-gradien-mode="linear-gradient(180deg, #ff99cc 0%, #ff3399 100%)"></div>
                <div class="warna coklat" data-gradien="linear-gradient(180deg, #d9b38c 0%, #b36b39 50%, #804000 100%)" data-cahaya="rgba(180,100,50,0.5)" data-warna-teks="#663300" data-gradien-mode="linear-gradient(180deg, #cc9966 0%, #994d00 100%)"></div>
            </div>
            <button class="tombol-lanjut" id="tombolLanjut" disabled>Selanjutnya</button>
        </div>
    </div>

    <div class="isi-utama" id="isiUtama">
        <h2><span class="ikon-pengulang">🔁</span> Pengulang Teks</h2>
        <input type="text" id="kataDasar" placeholder="Tulis teks di sini...">
        <input type="number" id="jumlahUlang" value="100">
        <div class="pilihan-mode">
            <label><input type="radio" name="mode" value="baris" checked><span>📏 Tiap Baris</span></label>
            <label><input type="radio" name="mode" value="jejer"><span>🔗 Berjejer</span></label>
        </div>
<button class="tombol-buat" onclick="buatUlang()"><span class="ikon-pengulang">🔁</span> Buat Teks</button>
        <textarea id="hasil" readonly placeholder="Hasil teks muncul di sini..."></textarea>
<div class="info" style="font-size:14px; color:#888; font-weight:normal;">👑 Pengulangan kamu: <span id="statsKamu">0</span> kali</div>
        <button class="tombol-salin" onclick="salinHasil()"><span>📋</span> Salin Hasil</button>
        
        <!-- === GANTI LINK DI BAWAH INI DENGAN LINK PROFIL SAWERIA KAMU === -->
        <button class="tombol-donasi" onclick="window.open('https://saweria.co/fandi247', '_blank')"><span>💸</span> Dukung Saya / Donasi</button>
    </div>
</div>

<script>
let warnaTerpilih = null;
const semuaWarna = document.querySelectorAll('.warna');
const tombolLanjut = document.getElementById('tombolLanjut');
const layarPilih = document.getElementById('layarPilih');
const isiUtama = document.getElementById('isiUtama');
const tombolBuat = document.querySelector('.tombol-buat');
const tombolSalin = document.querySelector('.tombol-salin');
const judul = document.querySelector('h2');
const info = document.querySelector('.info');
const kotakInput = document.querySelectorAll('input, textarea');
const modeLabel = document.querySelectorAll('.pilihan-mode label');

semuaWarna.forEach(warna => {
    warna.addEventListener('click', () => {
        semuaWarna.forEach(w => w.classList.remove('aktif'));
        warna.classList.add('aktif');
        warnaTerpilih = warna;
        tombolLanjut.classList.add('bisa');
        tombolLanjut.disabled = false;
        tombolLanjut.style.background = warna.dataset.gradien;
    });
});

tombolLanjut.addEventListener('click', () => {
    if(!warnaTerpilih) return;
    const gradien = warnaTerpilih.dataset.gradien;
    const cahaya = warnaTerpilih.dataset.cahaya;
    const warnaTeks = warnaTerpilih.dataset.warnaTeks;
    const gradienMode = warnaTerpilih.dataset.gradienMode;

    tombolBuat.style.background = gradien;
    tombolSalin.style.background = gradien;
    tombolBuat.style.boxShadow = `0 0 20px ${cahaya}, 0 0 30px ${cahaya}`;
    tombolSalin.style.boxShadow = `0 0 20px ${cahaya}, 0 0 30px ${cahaya}`;
    judul.style.color = warnaTeks;
    info.style.color = warnaTeks;
    kotakInput.forEach(i => i.style.borderColor = warnaTeks);
    modeLabel.forEach(lbl => {
        lbl.style.color = warnaTeks;
        lbl.style.borderColor = warnaTeks;
        if(lbl.querySelector('input').checked){
            lbl.style.background = gradienMode;
            lbl.style.color = '#fff';
        }
    });

    layarPilih.style.display = 'none';
    isiUtama.style.display = 'block';

    document.querySelectorAll('input[name=mode]').forEach(rd => {
        rd.onchange = () => {
            modeLabel.forEach(l => {
                l.style.background = '#fff';
                l.style.color = warnaTeks;
                if(l.querySelector('input').checked){
                    l.style.background = gradienMode;
                    l.style.color = '#fff';
                }
            });
        };
    });
});

function buatUlang(){
    let kata=document.getElementById('kataDasar').value;
    let kali=parseInt(document.getElementById('jumlahUlang').value)||1;
    let mode=document.querySelector('input[name=mode]:checked').value;
    if(!kata)return alert('Tulis dulu teksnya!');
    let hasil='', pemisah=mode==='baris'?'\n':'';
    for(let i=0;i<kali;i++)hasil+=kata+pemisah;
    document.getElementById('hasil').value=hasil.trim();
    document.getElementById('total').textContent=kali;
    document.getElementById('totalKarakter').textContent=hasil.length;
    updateStats();
}
async function salinHasil(){
    let teks=document.getElementById('hasil').value;
    if(!teks)return alert('Belum ada teks!');
    let ok=!1;
    try{await navigator.clipboard.writeText(teks);ok=!0}
    catch{let a=document.getElementById('hasil');a.select();ok=document.execCommand('copy')}
    
    if(ok){
        const popup=document.getElementById('popupOverlay');
        popup.classList.add('tampil');
        setTimeout(()=>popup.classList.remove('tampil'),3000);
    }else{
        alert('Gagal salin, coba salin manual');
    }
}

</script>
<!-- TOMBOL BAGIKAN: KANAN BAWAH, PESAN DI ATAS -->
<div style="position:fixed; bottom:20px; right:20px; z-index:999;">
  <!-- Pesan ajakan: DI ATAS tombol, bisa ditutup -->
  <div id="pesanAjak" style="margin-bottom:8px; background:#e3f2fd; border-radius:10px; padding:6px 10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); display:flex; align-items:center; gap:6px; width:max-content; margin-left:auto;">
    <button onclick="sembunyikanPesan()" style="background:none; border:none; font-size:14px; cursor:pointer; color:#666; line-height:1;">✕</button>
    <span style="font-size:13px; color:#1976d2;">Bagikan ke teman!</span>
  </div>

  <!-- Tombol bulat hijau kecil -->
  <button onclick="bagikanWeb()" style="width:55px; height:55px; border-radius:50%; background:linear-gradient(135deg, #4CAF50, #2E7D32); color:white; border:none; font-size:22px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,0.2); display:flex; align-items:center; justify-content:center; margin-left:auto;">
    ↗
  </button>
</div>

<script>
function sembunyikanPesan(){
  document.getElementById('pesanAjak').style.opacity='0';
  setTimeout(()=>document.getElementById('pesanAjak').style.display='none',300);
}
async function bagikanWeb(){
  const link=window.location.href;
  const teks="hai bro coba website ini kita iseng-iseng ke teman lain kita spam pasti seru kan";
  try{
    if(navigator.share) await navigator.share({title:"Pengulang Teks",text:teks,url:link});
    else{await navigator.clipboard.writeText(link);alert("✅ Link disalin! Kirim ke teman!");}
  }catch(e){alert("Salin link ini: "+link)}
}
// ===== FITUR TRACKING PENGULANGAN =====
function loadStats() {
    let stats = localStorage.getItem('pengulangStats');
    if (!stats) {
        stats = { total: 0 };
        localStorage.setItem('pengulangStats', JSON.stringify(stats));
    }
    return JSON.parse(stats);
}

function updateStats() {
    let stats = loadStats();
    stats.total += 1;
    localStorage.setItem('pengulangStats', JSON.stringify(stats));
    document.getElementById('statsKamu').textContent = stats.total;
}

// Tampilkan angka tersimpan saat halaman dibuka
document.getElementById('statsKamu').textContent = loadStats().total;
</script>
<div class="popup-overlay" id="popupOverlay">
    <div class="popup-kotak">✅ Berhasil Disalin!</div>
</div>

</body>
</html>
